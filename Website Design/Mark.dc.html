<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;overflow:hidden;background:{{ bg }};border-radius:{{ radiusCss }};padding:{{ padCss }};box-sizing:border-box">
  <img src="{{ src }}" alt="VangAI logo" style="display:block;width:100%;height:100%;object-fit:contain"></img>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:240,&quot;height&quot;:240},&quot;uid&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;a&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;tone&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;twotone&quot;,&quot;cream&quot;,&quot;orange&quot;],&quot;default&quot;:&quot;twotone&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;bg&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#FAEEDA&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;radius&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:44,&quot;min&quot;:0,&quot;max&quot;:120,&quot;tsType&quot;:&quot;number&quot;},&quot;pad&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:0,&quot;min&quot;:0,&quot;max&quot;:30,&quot;unit&quot;:&quot;%&quot;,&quot;tsType&quot;:&quot;number&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const tone = p.tone ?? "twotone";
    const files = {
      twotone: "assets/mark-twotone.png",
      cream: "assets/mark-cream.png",
      orange: "assets/mark-orange.png"
    };
    const radius = p.radius ?? 44;
    return {
      bg: p.bg ?? "#FAEEDA",
      radiusCss: (radius / 240 * 100) + "%",
      padCss: (p.pad ?? 0) + "%",
      src: files[tone] || files.twotone
    };
  }
}
</script>
</body>
</html>
