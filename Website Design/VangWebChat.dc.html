<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
@keyframes vwc-dot { 0%,60%,100%{transform:translateY(0);opacity:.35} 30%{transform:translateY(-4px);opacity:.95} }
.vwc-t > span { animation: vwc-dot 1200ms ease-in-out infinite; }
.vwc-t > span:nth-child(2){ animation-delay:160ms }
.vwc-t > span:nth-child(3){ animation-delay:320ms }
@media (prefers-reduced-motion: reduce){ .vwc-t > span { animation:none !important } }
</style>
</helmet>
<div style="font-family:Archivo,Helvetica,sans-serif;width:320px;max-width:100%;background:#2B2118;border-radius:46px;padding:10px;box-shadow:0 26px 64px rgba(43,33,24,0.26)">
  <div style="position:relative;background:#FFFFFF;border-radius:38px;height:640px;overflow:hidden;display:flex;flex-direction:column">
    <div style="position:absolute;top:11px;left:50%;transform:translateX(-50%);width:84px;height:23px;border-radius:99px;background:#2B2118;z-index:4"></div>

    <div style="position:relative;z-index:2;background:#F1EAE0;padding:14px 22px 0;display:flex;align-items:center;justify-content:space-between;color:#2B2118">
      <span style="font-size:12.5px;font-weight:700">9:41</span>
      <span style="display:flex;align-items:center;gap:5px">
        <svg viewBox="0 0 20 14" width="17" height="12" fill="#2B2118"><rect x="0" y="9" width="3" height="5" rx="1"/><rect x="4.7" y="6.5" width="3" height="7.5" rx="1"/><rect x="9.4" y="3.5" width="3" height="10.5" rx="1"/><rect x="14.1" y="0.5" width="3" height="13.5" rx="1"/></svg>
        <svg viewBox="0 0 18 14" width="15" height="12" fill="none" stroke="#2B2118" stroke-width="1.7" stroke-linecap="round"><path d="M1.2 4.6a11 11 0 0 1 15.6 0"/><path d="M4.1 7.8a7 7 0 0 1 9.8 0"/><path d="M7 11a3 3 0 0 1 4 0"/></svg>
        <svg viewBox="0 0 26 13" width="22" height="11" fill="none"><rect x="0.7" y="0.7" width="21" height="11.6" rx="3.4" stroke="rgba(43,33,24,0.45)" stroke-width="1.3"/><rect x="2.6" y="2.6" width="15" height="7.8" rx="2" fill="#2B2118"/><path d="M23.4 4.4v4.2a2.6 2.6 0 0 0 0-4.2z" fill="rgba(43,33,24,0.45)"/></svg>
      </span>
    </div>
    <div style="position:relative;z-index:2;background:#F1EAE0;padding:9px 14px 10px;display:flex;align-items:center;gap:8px">
      <div style="flex:1;min-width:0;background:#FFFFFF;border:1px solid rgba(43,33,24,0.14);border-radius:99px;padding:6px 12px;display:flex;align-items:center;gap:6px">
        <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="#6B6055" stroke-width="2.2" style="flex:none"><rect x="5" y="10.5" width="14" height="9.5" rx="2"/><path d="M8 10.5V7.6a4 4 0 0 1 8 0v2.9"/></svg>
        <span style="font-size:11.5px;color:rgba(43,33,24,0.6);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ siteHost }}</span>
      </div>
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="#6B6055" stroke-width="2.2" stroke-linecap="round" style="flex:none"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </div>

    <div style="position:relative;flex:1;min-height:0;background:#FAEEDA;overflow:hidden">
      <div style="padding:22px 20px 0;opacity:0.5">
        <div style="font-family:'IBM Plex Mono',monospace;font-size:8.5px;letter-spacing:0.16em;color:#D85A30">/ HASSELT</div>
        <div style="font-size:26px;font-weight:800;letter-spacing:-0.035em;line-height:1.02;margin-top:9px;color:#2B2118">Your car, back on the road.</div>
        <div style="height:9px;border-radius:99px;background:rgba(43,33,24,0.12);margin-top:14px"></div>
        <div style="height:9px;border-radius:99px;background:rgba(43,33,24,0.12);margin-top:7px;width:72%"></div>
        <div style="height:74px;border-radius:14px;background:rgba(43,33,24,0.09);margin-top:16px"></div>
      </div>

      <div style="position:absolute;left:10px;right:10px;bottom:10px;top:96px;background:#FFFFFF;border:1px solid rgba(43,33,24,0.14);border-radius:20px;box-shadow:0 18px 44px rgba(43,33,24,0.18);display:flex;flex-direction:column;overflow:hidden">
        <div style="background:#2B2118;padding:13px 15px;display:flex;align-items:center;gap:10px">
          <div style="width:32px;height:32px;border-radius:50%;background:#FAEEDA;flex:none;display:flex;align-items:center;justify-content:center">
            <div style="width:21px;height:21px"><dc-import name="Mark" uid="vwcAv" radius="{{ 0 }}" bg="transparent" hint-size="21px,21px"></dc-import></div>
          </div>
          <div style="min-width:0;flex:1">
            <div style="font-size:14px;font-weight:700;color:#FAEEDA;letter-spacing:-0.015em">{{ businessName }}</div>
            <div style="display:flex;align-items:center;gap:5px;margin-top:2px">
              <span style="width:6px;height:6px;border-radius:50%;background:#4ED07A;display:block"></span>
              <span style="font-size:10.5px;color:rgba(250,238,218,0.75)">Answers in seconds</span>
            </div>
          </div>
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="rgba(250,238,218,0.7)" stroke-width="2.4" stroke-linecap="round" style="flex:none"><path d="M6 6l12 12M18 6 6 18"/></svg>
        </div>

        <div ref="{{ listRef }}" style="flex:1;min-height:0;overflow-y:auto;padding:14px 13px;display:flex;flex-direction:column;gap:8px;background:#FFFDF8">
          <sc-for list="{{ msgs }}" as="m" hint-placeholder-count="2">
            <div style="display:flex;justify-content:{{ m.just }}">
              <div style="max-width:84%;background:{{ m.bg }};color:{{ m.fg }};border-radius:{{ m.radius }};padding:10px 13px;font-size:13.5px;line-height:1.45;text-wrap:pretty">{{ m.text }}</div>
            </div>
          </sc-for>
          <sc-if value="{{ typing }}" hint-placeholder-val="{{ false }}">
            <div style="display:flex;justify-content:flex-start">
              <div class="vwc-t" style="background:#D85A30;border-radius:14px 14px 14px 4px;padding:12px 14px;display:flex;align-items:center;gap:4px">
                <span style="width:6px;height:6px;border-radius:50%;background:#FFFFFF;display:block"></span>
                <span style="width:6px;height:6px;border-radius:50%;background:#FFFFFF;display:block"></span>
                <span style="width:6px;height:6px;border-radius:50%;background:#FFFFFF;display:block"></span>
              </div>
            </div>
          </sc-if>
          <sc-if value="{{ done }}" hint-placeholder-val="{{ false }}">
            <div style="background:#FAEEDA;border:1px solid rgba(43,33,24,0.16);border-radius:14px;padding:13px;text-align:center;margin-top:4px">
              <div style="font-size:12.5px;line-height:1.5;color:#2B2118;text-wrap:pretty">That is the demo. On your site it answers your customers, not ours.</div>
              <a href="{{ bookHref }}" style="display:inline-flex;align-items:center;gap:7px;background:#D85A30;color:#FAEEDA;font-size:12.5px;font-weight:600;padding:9px 17px;border-radius:99px;margin-top:10px;transition:background 180ms ease" style-hover="background:#2B2118;color:#FAEEDA">Book a call <svg viewBox="0 0 24 24" width="1.05em" height="1.05em" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" style="flex:none;display:block"><path d="M4 12h14"/><path d="M12.5 5.5 19.5 12l-7 6.5"/></svg></a>
            </div>
          </sc-if>
        </div>

        <div style="padding:0 11px 8px;display:{{ chipsD }};flex-direction:column;gap:5px;background:#FFFDF8">
          <sc-for list="{{ chips }}" as="c" hint-placeholder-count="3">
            <div onClick="{{ c.tap }}" role="button" style="border:1px solid rgba(216,90,48,0.55);color:#B8441F;background:#FFFFFF;font-size:12.5px;font-weight:600;padding:9px 13px;border-radius:99px;cursor:pointer;text-align:center;transition:background 160ms ease,color 160ms ease" style-hover="background:#D85A30;color:#FFFFFF">{{ c.label }}</div>
          </sc-for>
        </div>

        <div style="border-top:1px solid rgba(43,33,24,0.12);background:#FFFFFF;padding:9px 10px;display:flex;align-items:center;gap:8px">
          <input value="{{ draft }}" onChange="{{ onDraft }}" onKeyDown="{{ onKey }}" placeholder="Ask anything" style="flex:1;min-width:0;border:0;outline:none;background:transparent;font-family:Archivo,Helvetica,sans-serif;font-size:13.5px;color:#2B2118;padding:4px 2px"/>
          <div onClick="{{ send }}" role="button" style="width:34px;height:34px;flex:none;border-radius:50%;background:#D85A30;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:background 160ms ease" style-hover="background:#2B2118">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="#FAEEDA"><path d="M3.2 20.5 21.5 12 3.2 3.5l.1 6.6L15 12 3.3 13.9z"/></svg>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:360,&quot;height&quot;:700},&quot;businessName&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Garage Vanhees&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;siteHost&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;garagevanhees.be&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;bookHref&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;./VangAI Contact.dc.html&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  state = {
    msgs: [{ text: 'Hi, I am the assistant for Garage Vanhees. Ask me anything, or tap a question below.', mine: false }],
    typing: false, asked: 0, draft: '', done: false
  };

  qa() {
    return [
      { label: 'What does a basic service cost?', a: 'A basic service is \u20AC89, oil and filter included. If we find anything else we call you first, so nothing lands on the invoice as a surprise.' },
      { label: 'How fast can someone come by?', a: 'We normally have a slot within two working days. If you have broken down, tell me where you are and I will try to get you in today.' },
      { label: 'Can I book for this week?', a: 'Yes. Thursday at 15:00 or Friday at 11:00 are free. Which one shall I put your name on?' }
    ];
  }

  componentDidUpdate() { if (this._list) this._list.scrollTop = this._list.scrollHeight; }
  componentWillUnmount() { if (this._to) clearTimeout(this._to); }

  push(text, mine) {
    this.setState(function (s) { return { msgs: s.msgs.concat([{ text: text, mine: mine }]) }; });
  }

  ask(q, a) {
    if (this.state.typing) return;
    var self = this;
    this.push(q, true);
    this.setState(function (s) { return { typing: true, asked: s.asked + 1, draft: '' }; });
    this._to = setTimeout(function () {
      self.setState({ typing: false });
      self.push(a, false);
      self.setState(function (s) { return { done: s.asked >= 3 }; });
    }, 950);
  }

  sendDraft() {
    var v = (this.state.draft || '').trim();
    if (!v) return;
    var hit = null, list = this.qa();
    for (var i = 0; i < list.length; i++) {
      if (v.toLowerCase() === list[i].label.toLowerCase()) hit = list[i];
    }
    this.ask(v, hit ? hit.a : 'In this demo I only answer the three suggested questions. The live assistant is trained on your business and answers whatever your customers ask.');
  }

  renderVals() {
    var self = this;
    var chips = this.qa().slice(this.state.asked).map(function (item) {
      return { label: item.label, tap: function () { self.ask(item.label, item.a); } };
    });
    return {
      businessName: this.props.businessName || 'Garage Vanhees',
      siteHost: this.props.siteHost || 'garagevanhees.be',
      bookHref: this.props.bookHref || './VangAI Contact.dc.html',
      msgs: this.state.msgs.map(function (m) {
        return {
          text: m.text,
          just: m.mine ? 'flex-end' : 'flex-start',
          bg: m.mine ? '#E8E4DC' : '#D85A30',
          fg: m.mine ? '#2B2118' : '#FFFFFF',
          radius: m.mine ? '14px 14px 4px 14px' : '14px 14px 14px 4px'
        };
      }),
      typing: this.state.typing,
      done: this.state.done,
      chips: chips,
      chipsD: (chips.length && !this.state.done) ? 'flex' : 'none',
      draft: this.state.draft,
      onDraft: function (e) { self.setState({ draft: e.target.value }); },
      onKey: function (e) { if (e.key === 'Enter') { e.preventDefault(); self.sendDraft(); } },
      send: function () { self.sendDraft(); },
      listRef: function (el) { self._list = el; }
    };
  }
}
</script>
</body>
</html>
