<style>
@keyframes vlb-pulse { 0%{transform:scale(.4);opacity:.85} 100%{transform:scale(1.7);opacity:0} }
@keyframes vlb-pop {
  0%{opacity:0;transform:translateY(0) scale(.45)}
  16%{opacity:1;transform:translateY(-16px) scale(1)}
  64%{opacity:1;transform:translateY(-32px) scale(1)}
  88%,100%{opacity:0;transform:translateY(-40px) scale(.9)}
}
.vlb-pop1{animation:vlb-pop 3s ease-out 0s infinite}
.vlb-pop2{animation:vlb-pop 3s ease-out 1s infinite}
.vlb-pop3{animation:vlb-pop 3s ease-out 2s infinite}
[data-paused="1"] *{animation-play-state:paused !important}
@media (prefers-reduced-motion: reduce){ .vlb-scene *{animation:none !important} }
</style>

<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1020,&quot;height&quot;:640},&quot;paceSeconds&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:54,&quot;min&quot;:40,&quot;max&quot;:80,&quot;step&quot;:1,&quot;unit&quot;:&quot;s&quot;,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Animation&quot;}}">
class Component extends DCLogic {
  state = { missed: 0, fixed: false };
  componentDidMount() {
    var self = this;
    var go = function () {
      if (!window.VangLostEngine || !self._root) { self._w = setTimeout(go, 60); return; }
      self._eng = window.VangLostEngine.start(self._root, {
        pace: function () { return self.props.paceSeconds; },
        onState: function (m, f) { if (m !== self.state.missed || f !== self.state.fixed) self.setState({ missed: m, fixed: f }); }
      });
    };
    go();
  }
  componentWillUnmount() { clearTimeout(this._w); if (this._eng) this._eng.stop(); }
  renderVals() {
    var self = this, fixed = this.state.fixed;
    return {
      rootRef: function (el) { self._root = el; },
      tickText: fixed ? 'Missed customers with VangAI' : 'Missed customers',
      tickCount: fixed ? '0' : String(this.state.missed),
      tickBg: fixed ? 'rgba(216,90,48,0.12)' : 'rgba(43,33,24,0.04)',
      tickBd: fixed ? 'rgba(216,90,48,0.5)' : 'rgba(43,33,24,0.18)',
      tickLabel: fixed ? '#B8441F' : 'rgba(43,33,24,0.6)',
      tickNum: fixed ? '#D85A30' : '#2B2118'
    };
  }
}
</script>
